# Windows desktop (host) build: BOMScanner.exe plus its DLLs and data, zipped.
#
# Runs on every `v*` tag (the zip is also attached to the GitHub release) and
# on demand (Actions -> Windows -> Run workflow). Flutter cannot build
# Windows apps from macOS, so this is the way to get the .exe.
name: Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' pubspec.yaml)"
          fi
          echo "build_name=${name}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: flutter build windows --release --build-name=${{ steps.version.outputs.build_name }} --build-number=${{ github.run_number }}

      - name: Bundle the Visual C++ runtime
        # So the .exe runs on PCs without the VC++ redistributable installed.
        shell: pwsh
        run: |
          $release = "build/windows/x64/runner/Release"
          foreach ($dll in "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll") {
            Copy-Item "$env:WINDIR/System32/$dll" $release
          }
          Get-ChildItem $release

      - name: Zip
        id: zip
        shell: pwsh
        run: |
          $zip = "BOMScanner-windows-${{ steps.version.outputs.build_name }}.zip"
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zip
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: BOMScanner-windows-${{ steps.version.outputs.build_name }}
          path: ${{ steps.zip.outputs.zip }}
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "BOM 掃描 $tag"
          gh release upload "$tag" "${{ steps.zip.outputs.zip }}" --clobber
